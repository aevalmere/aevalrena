# Cloudflare Worker with static assets: the built site (dist) plus the LAN rendezvous on /api/*.
# Cloudflare's Git-connected "Workers & Pages" project runs `npm run build` then `npx wrangler deploy`.
#
# The rendezvous stores lobby codes in the KV namespace bound as LOBBY. Create one with
#   npx wrangler kv namespace create LOBBY
# and paste the id below. Without the binding /api/health answers 503 and the game falls back to
# long codes. docs/LAN.md section 11.9.
name = "aevalrena"
main = "server/rendezvous/worker.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only /api/* reaches the Worker; every other path is served from dist.
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "LOBBY"
id = "b02f5d8a2dce4a81b9688d2bbff94968"
