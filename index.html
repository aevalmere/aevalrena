<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aevalrena</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070a16'/%3E%3Cpath d='M8 1L9.4 6.6 15 8 9.4 9.4 8 15 6.6 9.4 1 8 6.6 6.6Z' fill='%238fd3ff'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0e0f17;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      canvas#game {
        image-rendering: pixelated;
        display: block;
        margin: auto;
      }
      #hud {
        position: absolute;
        pointer-events: none;
        container-type: size;
      }
      #ui {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud" hidden></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
